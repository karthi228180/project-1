apiVersion: apps/v1
kind: Deployment
metadata:
    name: React-app
    labels: 
      app: todo-app
spec:
  replicas: 3
  selector:
    matchLabeles:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: c1
          image: karthikcls/cicd:latest
          ports:
            - containersPort: 8080

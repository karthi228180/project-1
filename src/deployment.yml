apiVersion: apps/v1
kind: Deployment
metadata:
    name: react-app
    labels: 
      app: todo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: c1
          image: karthikcls/cicd:latest
          ports:
            - containerPort: 8080
